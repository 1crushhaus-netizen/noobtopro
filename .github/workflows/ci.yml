name: CI

# Runs on every PR and on pushes to main. Configure branch protection on `main`
# to require the "Test and build" status check below, so nothing merges unless
# tests + build pass. (That is the job's `name:`, which is the check context.)
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only checks out and builds — it never writes to
# the repo, posts comments, or publishes artifacts, so read-only is sufficient.
permissions:
  contents: read

# Cancel superseded runs: a newer push to the same branch/PR supersedes the older
# one, so don't keep burning CI minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static analysis (ESLint flat config, eslint.config.mjs). Fast fail-first gate.
      # `npm run lint` runs `eslint . --max-warnings 20`: it fails on any ERROR and on MORE
      # than the current 20 advisory warnings — a RATCHET so the warning count can only go
      # down, never up (a stale hook dep / dead binding now fails CI). Lower the cap in
      # package.json as warnings are fixed. Enforces correctness (incl. react-hooks/rules-of-hooks)
      # and the server-only-secret import boundary (no GROQ/Polar/service-role module in a client).
      # NOTE (deferred): a tsc/typecheck gate is intentionally NOT added — the repo is untyped JS,
      # so it would fail. Revisit if/when types are introduced.
      - name: Lint (ESLint)
        run: npm run lint

      # Dependency scan (audit 08 P1). GATE on production deps only — a high/critical vuln
      # in anything shipped to users fails the build. Currently 0 high / 0 critical: the only
      # open advisories are moderate (postcss GHSA-qx2v-qp2m-jg93, transitively via next →
      # @vercel/analytics, @vercel/speed-insights, geist), which sit below the high gate and
      # whose fix needs a future next bump — so the full audit below surfaces them
      # advisory-only (non-blocking).
      - name: Dependency audit (production — gate on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (full — advisory)
        run: npm audit || true

      # Content validators (curated guides + diagnostic items) — previously orphaned scripts.
      - name: Validate content data
        run: npm run validate

      # Unit tests WITH coverage thresholds (vitest.config.js: ~80% lines / 70% branches).
      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Production build
        run: npm run build
        env:
          # Build must succeed without real secrets; the app degrades to guest
          # mode and the API routes only read these at request time.
          GROQ_API_KEY: ""
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
